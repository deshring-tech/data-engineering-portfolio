name: Sync to Hugging Face hub
on:
  push:
    branches: [main]

  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push https://Deshring:$HF_TOKEN@huggingface.co/spaces/Deshring/deshring-portfolio main:main -f > push_log.txt 2>&1 || true
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add push_log.txt || true
          git commit -m "Upload push log" || true
          git push origin main || true
